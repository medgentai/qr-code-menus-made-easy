<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>TapDodo - QR Code Restaurant Menu System | Digital Ordering Solution</title>
    <meta name="title" content="TapDodo - QR Code Restaurant Menu System | Digital Ordering Solution">
    <meta name="description" content="Transform your restaurant with TapDodo's contactless QR code menu system. Easy digital ordering, real-time menu updates, and seamless customer experience for restaurants, hotels, cafes, and food trucks." />
    <meta name="keywords" content="QR code menu, digital menu, restaurant technology, contactless ordering, menu management, hospitality software, restaurant POS, digital ordering system">
    <meta name="author" content="TapDodo" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tapdodo.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tapdodo.com/" />
    <meta property="og:title" content="TapDodo - QR Code Restaurant Menu System | Digital Ordering Solution" />
    <meta property="og:description" content="Transform your restaurant with TapDodo's contactless QR code menu system. Easy digital ordering, real-time menu updates, and seamless customer experience." />
    <meta property="og:image" content="https://tapdodo.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="TapDodo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tapdodo.com/" />
    <meta property="twitter:title" content="TapDodo - QR Code Restaurant Menu System | Digital Ordering Solution" />
    <meta property="twitter:description" content="Transform your restaurant with TapDodo's contactless QR code menu system. Easy digital ordering, real-time menu updates, and seamless customer experience." />
    <meta property="twitter:image" content="https://tapdodo.com/twitter-image.jpg" />
    <meta name="twitter:site" content="@tapdodo" />
    <meta name="twitter:creator" content="@tapdodo" />

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0ea5e9">
    
    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://randomuser.me">
    <link rel="dns-prefetch" href="//www.transparenttextures.com">
    
    <!-- Additional SEO meta tags -->
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TapDodo">
    <meta name="msapplication-TileColor" content="#0ea5e9">

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TapDodo",
      "description": "QR code restaurant menu system and digital ordering solution for hospitality businesses",
      "url": "https://tapdodo.com",
      "logo": "https://tapdodo.com/logo.png",
      "foundingDate": "2024",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9876543210",
        "contactType": "customer service",
        "availableLanguage": ["English", "Hindi"]
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "sameAs": [
        "https://twitter.com/tapdodo",
        "https://linkedin.com/company/tapdodo",
        "https://facebook.com/tapdodo"
      ]
    }
    </script>

    <!-- Structured Data - SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TapDodo",
      "description": "QR code restaurant menu system with digital ordering capabilities",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "499",
        "priceCurrency": "INR",
        "priceValidUntil": "2025-12-31"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      }
    }
    </script>

    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TapDodo",
      "url": "https://tapdodo.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://tapdodo.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
